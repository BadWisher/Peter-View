site_name: Peter View
site_url: https://badwisher.github.io/Peter-View/wiki/
repo_url: https://github.com/BadWisher/Peter-View
repo_name: BadWisher/Peter-View
docs_dir: wiki
site_dir: docs/wiki
theme:
  name: material
  language: ru
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Документация: index.md
  - Начало работы:
      - Установка и первый запуск: tutorial.md
  - Проверка документов:
      - Текст, файл или страница: how-to/check.md
      - Список замечаний: how-to/review.md
      - Style Guide: how-to/styleguide.md
      - История и аналитика: how-to/history.md
  - Администрирование:
      - Пользователи: how-to/users.md
      - Языковая модель: how-to/llm.md
      - Состояние сервисов: how-to/health.md
      - Дополнительные разделы: how-to/features.md
      - Документы: how-to/documents.md
      - OpenAPI: how-to/api.md
      - Наблюдение: how-to/watch.md
      - Скриншоты: how-to/screenshots.md
      - Вход через организацию: how-to/oidc.md
      - Резервная копия: how-to/backup.md
      - Не запускается: how-to/troubleshoot.md
  - Справка:
      - Переменные .env: reference/config.md
      - Роли: reference/roles.md
      - Разделы: reference/sections.md
      - Compose и команды: reference/compose.md
  - Устройство:
      - Назначение системы: explanation/what.md
      - Откуда замечания: explanation/engines.md
      - Почему три контейнера: explanation/architecture.md
