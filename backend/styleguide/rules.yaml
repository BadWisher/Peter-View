# Style Guide для LLM-вычитки.
# Редактируйте правила здесь — изменения подхватываются без пересборки образа
# (RAG-индекс перестраивается автоматически при смене содержимого файла).
# Каждое правило: rule_id (уникальный), title, section, rule, severity, примеры.

version: 3
rules:
- rule_id: RuStyleGuide.Glossary
  title: Глоссарий
  section: Ключевые рекомендации / Глоссарий
  group: Ключевые рекомендации
  rule: Использовать утвержденные термины из глоссария.
  generalization: Словарные замены применяются как термины и словосочетания, а не как разовые примеры.
  severity: error
  good_examples:
  - Укажите электронную почту.
  - Фильтрация трафика включена.
  - Веб-сервер работает.
  bad_examples:
  - Укажите email.
  - Очистка трафика включена.
  - web-сервер работает.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.ProductNames
  title: Наименования продуктов и компании
  section: Ключевые рекомендации / Наименование продукта, компонентов, юр.лиц, компании
  group: Ключевые рекомендации
  rule: Использовать полные утвержденные названия продукта и компании.
  generalization: Проверяются сокращения и неутвержденные варианты названий.
  severity: error
  good_examples:
  - Kaspersky DDoS Protection защищает инфраструктуру.
  - DDoS-атаки
  bad_examples:
  - KDP защищает инфраструктуру.
  - Kaspersky DDOS Protection
  - KasperskyDDoS Protection
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_SettingsGroup
  title: Блок параметров
  section: Ключевые рекомендации / Названия элементов интерфейса / Блок параметров
  group: Ключевые рекомендации
  rule: Для settings group использовать «блок параметров», а не «группа параметров».
  generalization: Проверяется термин элемента интерфейса в разных контекстах.
  severity: error
  good_examples:
  - В блоке параметров выберите значение.
  bad_examples:
  - В группе параметров выберите значение.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_Tab
  title: Вкладка
  section: Ключевые рекомендации / Названия элементов интерфейса / Вкладка
  group: Ключевые рекомендации
  rule: Вкладку выбирают, а не активизируют, открывают или переходят на нее.
  generalization: Проверяются запрещенные глаголы рядом с термином «вкладка».
  severity: error
  good_examples:
  - Выберите вкладку Общие.
  bad_examples:
  - Откройте вкладку Общие.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_Click
  title: Клик
  section: Ключевые рекомендации / Названия элементов интерфейса / Кнопка
  group: Ключевые рекомендации
  rule: Не использовать «кликнуть» и формы этого слова.
  generalization: Проверяются словоформы «кликнуть», если они описывают действие пользователя.
  severity: error
  good_examples:
  - Нажмите кнопку «Выйти».
  bad_examples:
  - Кликните на кнопку «Выйти».
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_QuotedLabels
  title: Кавычки в названиях кнопок
  section: Ключевые рекомендации / Названия элементов интерфейса / Кнопка
  group: Ключевые рекомендации
  rule: Названия кнопок в тексте заключать в русские кавычки «елочки».
  generalization: Правило применяется к имени элемента после слова «кнопка», но не к общему описанию кнопки
    без собственного названия.
  severity: warning
  good_examples:
  - Кнопка «Добавить» открывает окно создания правила.
  bad_examples:
  - Кнопка Добавить открывает окно создания правила.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: false
  relationships:
    specializes:
    - Базовая.Форматирование
  conflict_family: ui-button-label-format
- rule_id: RuStyleGuide.CrossRef_Link
  title: Ссылка на раздел документации
  section: Форматирование / Перекрестные ссылки
  group: Форматирование
  rule: Отсылку к конкретному разделу документации оформлять гиперссылкой.
  generalization: Проверяется наличие ссылки у названия раздела в конструкциях «см. в разделе», «подробнее
    в разделе» и аналогичных отсылках.
  severity: warning
  good_examples:
  - Подробнее см. в разделе «Настройка фильтрации» (гиперссылка).
  bad_examples:
  - Подробнее см. в разделе Настройка фильтрации.
  categories:
  - Форматирование
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: false
  relationships:
    specializes:
    - Базовая.Форматирование
  conflict_family: cross-reference-format
- rule_id: RuStyleGuide.UITerms_DoubleClick
  title: Двойной щелчок
  section: Ключевые рекомендации / Названия элементов интерфейса / Кнопка
  group: Ключевые рекомендации
  rule: Использовать «двойным щелчком мыши», а не «дважды кликните».
  generalization: Проверяется устойчивый неверный способ описания двойного нажатия.
  severity: error
  good_examples:
  - Запустите файл двойным щелчком мыши.
  bad_examples:
  - Дважды кликните по файлу.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_RightClick
  title: Правая кнопка мыши
  section: Ключевые рекомендации / Названия элементов интерфейса / Кнопка
  group: Ключевые рекомендации
  rule: Описывать действие как нажатие на правую кнопку мыши.
  generalization: Проверяется нежелательная конструкция «щелкните правой кнопкой мыши».
  severity: error
  good_examples:
  - Откройте меню нажатием на правую кнопку мыши.
  bad_examples:
  - Щелкните правой кнопкой мыши по задаче.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_Menu
  title: Контекстное меню
  section: Ключевые рекомендации / Названия элементов интерфейса / Меню
  group: Ключевые рекомендации
  rule: Использовать «контекстное меню», а не «динамическое» или «всплывающее».
  generalization: Проверяются запрещенные варианты названия элемента меню.
  severity: error
  good_examples:
  - Откройте контекстное меню объекта.
  bad_examples:
  - Откройте всплывающее меню объекта.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_WindowResize
  title: Размеры окна
  section: Ключевые рекомендации / Названия элементов интерфейса / Окно
  group: Ключевые рекомендации
  rule: Использовать «задать размеры окна».
  generalization: Проверяются нежелательные глаголы изменения размера окна.
  severity: error
  good_examples:
  - Задайте размеры окна.
  bad_examples:
  - Раздвиньте окно.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_WindowMove
  title: Перемещение окна
  section: Ключевые рекомендации / Названия элементов интерфейса / Окно
  group: Ключевые рекомендации
  rule: Использовать «переместить окно».
  generalization: Проверяются нежелательные глаголы для действия с окном.
  severity: error
  good_examples:
  - Переместите окно.
  bad_examples:
  - Перетащите окно.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_Field
  title: Значение в поле
  section: Ключевые рекомендации / Названия элементов интерфейса / Поле
  group: Ключевые рекомендации
  rule: Значение в поле можно указать или ввести, не определить.
  generalization: Проверяется глагол рядом со словом «значение» в UI-контексте.
  severity: error
  good_examples:
  - Укажите значение в поле.
  bad_examples:
  - Определите значение в поле.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_Slider
  title: Ползунок
  section: Ключевые рекомендации / Названия элементов интерфейса / Ползунок
  group: Ключевые рекомендации
  rule: Использовать «ползунок», а не «бегунок».
  generalization: Проверяется термин элемента интерфейса.
  severity: error
  good_examples:
  - Переместите ползунок.
  bad_examples:
  - Переместите бегунок.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_List
  title: Элементы списка
  section: Ключевые рекомендации / Названия элементов интерфейса / Список
  group: Ключевые рекомендации
  rule: Список содержит элементы, не позиции, строки или пункты.
  generalization: Проверяется терминология рядом со словом «список».
  severity: warning
  good_examples:
  - Выберите элемент списка.
  bad_examples:
  - Выберите пункт списка.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_Checkbox
  title: Флажок
  section: Ключевые рекомендации / Названия элементов интерфейса / Флажок
  group: Ключевые рекомендации
  rule: Использовать «флажок», а не «чекбокс».
  generalization: Проверяется термин элемента интерфейса и его распространенные варианты.
  severity: error
  good_examples:
  - Установите флажок.
  bad_examples:
  - Установите чекбокс.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.UITerms_CheckboxVerbs
  title: Глаголы с флажком
  section: Ключевые рекомендации / Названия элементов интерфейса / Флажок
  group: Ключевые рекомендации
  rule: Флажок можно установить или снять.
  generalization: Проверяются запрещенные глаголы рядом с термином «флажок».
  severity: error
  good_examples:
  - Снимите флажок.
  bad_examples:
  - Отключите флажок.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.Units_International
  title: Единицы измерения
  section: Ключевые рекомендации / Единицы измерения
  group: Ключевые рекомендации
  rule: В русскоязычных текстах использовать русские обозначения единиц измерения.
  generalization: Проверяются международные обозначения там, где у гайда есть русский вариант.
  severity: error
  good_examples:
  - Скорость составляет 10 Мбит/с.
  bad_examples:
  - Скорость составляет 10 Mbit/s.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.Units_Period
  title: Точка после единиц
  section: Ключевые рекомендации / Единицы измерения
  group: Ключевые рекомендации
  rule: Не ставить точку после сокращения единицы измерения.
  generalization: Проверяются сокращения единиц с точкой.
  severity: error
  good_examples:
  - Время ожидания 5 мин.
  bad_examples:
  - Значение равно 5 мин..
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.FileFormats_FormatCase
  title: Форматы файлов
  section: Ключевые рекомендации / Расширение и формат файлов
  group: Ключевые рекомендации
  rule: Форматы файлов пишутся прописными буквами.
  generalization: Проверяются известные форматы из таблицы гайда.
  severity: error
  good_examples:
  - Файл формата JSON.
  bad_examples:
  - Файл формата json.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.FileFormats_ExtensionCase
  title: Расширения файлов
  section: Ключевые рекомендации / Расширение и формат файлов
  group: Ключевые рекомендации
  rule: Расширения файлов пишутся строчными буквами с точкой.
  generalization: Проверяются известные расширения из таблицы гайда.
  severity: error
  good_examples:
  - Файл с расширением .txt.
  bad_examples:
  - Файл с расширением .TXT.
  categories:
  - Ключевые рекомендации
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.Bureaucracy
  title: Канцеляризмы
  section: Общие принципы / Канцеляризмы
  group: Общие принципы
  rule: Использовать простой язык вместо канцеляризмов.
  generalization: Проверяется словарь устойчивых канцелярских выражений.
  severity: warning
  good_examples:
  - Настройте приложение.
  bad_examples:
  - Пройдите процедуру настройки приложения.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.Jargon
  title: Жаргонизмы
  section: Общие принципы / Терминология
  group: Общие принципы
  rule: Не использовать профессиональный жаргон вместо терминов.
  generalization: Проверяется словарь жаргонных терминов и утвержденных замен.
  severity: error
  good_examples:
  - Системный администратор настроил сервер.
  bad_examples:
  - Сисадмин настроил сервер.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.Anglicisms
  title: Англицизмы
  section: Общие принципы / Англицизмы
  group: Общие принципы
  rule: Заменять англицизмы освоенными русскими синонимами, если это не мешает пониманию.
  generalization: Проверяется словарь нежелательных англицизмов, IT-термины не считаются ошибкой сами
    по себе.
  severity: warning
  good_examples:
  - Установка завершена.
  bad_examples:
  - Инсталляция завершена.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.SentenceLength
  title: Длинные предложения
  section: Общие принципы / Длинные предложения
  group: Общие принципы
  rule: Стараться писать не больше 25 слов в предложении.
  generalization: Считаются слова в предложении; результат — предупреждение, потому что правило зависит
    от контекста.
  severity: warning
  good_examples:
  - Откройте раздел. Выберите нужный элемент.
  bad_examples:
  - Откройте раздел, выберите нужный элемент, настройте параметры, сохраните изменения, проверьте результат
    выполнения операции в личном кабинете, добавьте комментарий, приложите файл и отправьте подробный
    отчет администратору проекта.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: false
  relationships: {}
- rule_id: RuStyleGuide.HomogeneousMembers
  title: Однородные члены
  section: Общие принципы / Однородные члены предложения
  group: Общие принципы
  rule: Не использовать больше трех однородных членов подряд.
  generalization: Проверяется типичный список однородных членов; сложный синтаксис требует ручной оценки.
  severity: warning
  good_examples:
  - Система проверяет и сохраняет данные.
  bad_examples:
  - Система проверяет, сохраняет, отправляет и архивирует данные.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: false
  relationships: {}
- rule_id: RuStyleGuide.TimelessDocs
  title: Бессрочная документация
  section: Общие принципы / Бессрочная документация
  group: Общие принципы
  rule: Избегать временных указаний.
  generalization: Проверяется словарь временных маркеров, которые делают документацию недолговечной.
  severity: warning
  good_examples:
  - В версии продукта доступна функция.
  bad_examples:
  - В последней версии продукта доступна функция.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 60
  mandatory: false
  machine_verifiable: true
  relationships: {}
- rule_id: RuStyleGuide.Consistency
  title: Одно понятие — одно слово
  section: Общие принципы / Однозначность
  group: Общие принципы
  rule: Использовать одно наименование для одного понятия по всему тексту.
  generalization: Проверяются пары известных терминов; остальные случаи требуют ручной оценки.
  severity: error
  good_examples:
  - Трафик направляется в Центр очистки. Центр очистки фильтрует трафик.
  bad_examples:
  - Трафик направляется в Центр очистки. Кластер фильтрующих узлов фильтрует трафик.
  categories:
  - Общие принципы
  tasks:
  - proofreading
  scope: all
  priority: 90
  mandatory: false
  machine_verifiable: false
  relationships: {}
- rule_id: RuStyleGuide.InclusiveLanguage
