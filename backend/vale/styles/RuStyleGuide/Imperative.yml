extends: existence
message: "Используйте повелительное наклонение вместо модальных конструкций. Например: «нажмите» вместо «вам следует нажать»."
level: warning
nonword: true
raw:
  - '[Вв]ам\s+(следует|необходимо|нужно|стоит|надо|придется|требуется)'
  - '[Вв]ы\s+должны'
  - '[Сс]ледует\s+\w+ть'
  - '[Нн]еобходимо\s+\w+ть'
  - '[Тт]ребуется\s+\w+ть'
