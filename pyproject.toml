[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# Start with correctness checks that the existing codebase can satisfy. Broader
# style rules can be enabled incrementally without turning CI on as technical debt.
select = ["E9", "F63", "F7", "F82"]
