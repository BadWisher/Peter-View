name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MkDocs
        run: |
          pip install mkdocs-material mkdocs-redirects
          mkdocs build --site-dir site/wiki
      - name: Landing
        run: |
          mkdir -p site/fonts site/assets
          cp landing/index.html site/index.html
          cp landing/style.css site/style.css
          cp frontend/public/fonts/*.woff2 site/fonts/
          cp frontend/public/logo.png site/logo.png
          cp frontend/public/favicon.png site/favicon.png
          cp docs/screenshots/01-login.png docs/screenshots/02-check.png site/assets/
          cp -r docs/preview site/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
