name: Publish images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image names
        id: names
        run: echo "repository=${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          repo="${{ steps.names.outputs.repository }}"
          {
            echo "backend<<EOF"
            echo "ghcr.io/${repo}/backend:${sha}"
            echo "ghcr.io/${repo}/backend:main"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "ghcr.io/${repo}/backend:${GITHUB_REF_NAME#v}"
            fi
            echo "EOF"
            echo "frontend<<EOF"
            echo "ghcr.io/${repo}/frontend:${sha}"
            echo "ghcr.io/${repo}/frontend:main"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "ghcr.io/${repo}/frontend:${GITHUB_REF_NAME#v}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.tags.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
